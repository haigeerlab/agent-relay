# agent-relay ci-macos (D80, D80a): the local validation on macOS, for every pull request and every push to main.
# ci-on-demand (D135-D139): skipped when only exempt paths changed (scripts/ci_scope.py); always full weekly and
# when run by hand. Plugin spec v1.2: one required check, "CI required" (C1); plugin manifest and frontmatter
# checks (C7); hub rules in report mode; pinned to autopilot-hub@b34560f8d398cd946f2fc3f0cd7526d336f59a01;
# no token permission unless a job asks for it (C8).
name: CI

on:
  pull_request:
    # edited: a title or body change reruns the WHOLE CI. Never skip jobs on `edited`: `CI required` treats skipped
    # as fine, so skipping tests there would let a title edit turn a failing PR green.
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Python ${{ matrix.python }} / Node ${{ matrix.node }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
        node: ['22', '24']
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Path privacy (S107): runs before the scope decision, so a change to exempt paths only is checked too.
      - name: No local home paths
        run: python3 -B scripts/check_local_paths.py

      # The four jobs always run and report, so the required checks never wait (D136); in skip mode every later step
      # is skipped. Event data reaches the script through the environment, never the shell command line.
      - name: Scope
        id: scope
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 -B scripts/ci_scope.py

      # Python 3.9 is Apple's, from the Command Line Tools: the one macOS users run (setup-python has no current
      # 3.9 build for arm64).
      - name: Python 3.9 (Apple Command Line Tools)
        if: steps.scope.outputs.scope != 'skip' && matrix.python == '3.9'
        run: |
          mkdir -p "$RUNNER_TEMP/py39"
          ln -s /usr/bin/python3 "$RUNNER_TEMP/py39/python3"
          echo "$RUNNER_TEMP/py39" >> "$GITHUB_PATH"
      - name: Python 3.14
        if: steps.scope.outputs.scope != 'skip' && matrix.python == '3.14'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.scope != 'skip'
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: plugins/agent-relay/bridge/package-lock.json

      - name: Check the toolchain is the one asked for
        if: steps.scope.outputs.scope != 'skip'
        env:
          WANT_PYTHON: ${{ matrix.python }}
          WANT_NODE: ${{ matrix.node }}
        run: |
          python3 -c 'import os, sys; want = tuple(map(int, os.environ["WANT_PYTHON"].split("."))); print(sys.executable, sys.version.split()[0]); sys.exit(sys.version_info[:2] != want)'
          node -e 'console.log(process.execPath, process.versions.node); process.exit(process.versions.node.split(".")[0] === process.env.WANT_NODE ? 0 : 1)'

      - name: Bridge dependencies
        if: steps.scope.outputs.scope != 'skip'
        working-directory: plugins/agent-relay/bridge
        run: npm ci

      - name: doctor toolchain
        if: steps.scope.outputs.scope != 'skip'
        run: |
          python3 -B plugins/agent-relay/hooks/native_collaboration_runtime.py doctor --node "$(command -v node)" > "$RUNNER_TEMP/doctor.json" || true
          python3 -c 'import json, sys; c = next(c for c in json.load(open(sys.argv[1]))["checks"] if c["check"] == "toolchain"); print("toolchain:", c["state"], c["detail"])' "$RUNNER_TEMP/doctor.json"

      - name: Validate
        if: steps.scope.outputs.scope != 'skip'
        run: |
          bash scripts/validate.sh | tee "$RUNNER_TEMP/validate.txt"
          grep -qE "ok    bridge: npm run check +[0-9]+$" "$RUNNER_TEMP/validate.txt" || { echo "the bridge check did not run or ran no counted tests"; exit 1; }

      # C10: the checks must not change tracked files.
      - name: Tracked files unchanged
        if: steps.scope.outputs.scope != 'skip'
        run: git diff --exit-code

  # C7: the plugin and marketplace manifests, and every skill, command and agent frontmatter. Linux, not
  # macOS: nothing here depends on the host, and it always runs (it takes no scope decision).
  plugin:
    name: Plugin manifest and frontmatter
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # One pinned CLI version for every repository, at least 7 days old; bump it here, across all repos at once.
      CLAUDE_CODE_VERSION: "2.1.321"
      DISABLE_AUTOUPDATER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check out autopilot-hub at the pinned SHA (scripts only)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: haigeerlab/autopilot-hub
          ref: b34560f8d398cd946f2fc3f0cd7526d336f59a01
          path: .hub
          persist-credentials: false
      - name: claude plugin validate --strict on an exported copy
        run: |
          # Validate a `git archive` export. When the plugin lives at the repository root, drop the root CLAUDE.md
          # and AGENTS.md from the export: the official command treats them as errors there (standard C7, v1.4).
          export_dir="${RUNNER_TEMP}/plugin-export"
          mkdir -p "${export_dir}"
          git archive HEAD | tar -x -C "${export_dir}"
          if [ -f "${export_dir}/.claude-plugin/plugin.json" ]; then rm -f "${export_dir}/CLAUDE.md" "${export_dir}/AGENTS.md"; fi
          cd "${export_dir}"
          claude() { npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" "$@"; }
          claude plugin validate --strict .
          python3 - <<'PY' > "${RUNNER_TEMP}/plugin-dirs.txt"
          import json, os
          data = json.load(open(".claude-plugin/marketplace.json", encoding="utf-8"))
          for entry in data.get("plugins") or []:
              src = entry.get("source") if isinstance(entry, dict) else None
              if isinstance(src, str) and os.path.normpath(src) not in (".", ""):
                  print(os.path.normpath(src))
          PY
          while read -r dir; do claude plugin validate --strict "${dir}"; done < "${RUNNER_TEMP}/plugin-dirs.txt"
      - name: Skill, command and agent frontmatter really parses (C7)
        run: python3 -B .hub/rules/frontmatter.py --repo .

  rules:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      checks: write
      pull-requests: read
    uses: haigeerlab/autopilot-hub/.github/workflows/rules.yml@b34560f8d398cd946f2fc3f0cd7526d336f59a01
    with:
      hub_ref: b34560f8d398cd946f2fc3f0cd7526d336f59a01
      # report during the shadow run; switch to enforce once the user has seen the shadow-run results.
      mode: report

  # C1: the only required check on main. It needs every other job and fails unless all of them succeeded, so a
  # job added or renamed later needs no change to branch protection.
  ci-required:
    name: CI required
    if: always()
    needs: [validate, plugin, rules]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every CI job succeeded (skipped means "not run for this event", e.g. rules on push)
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$NEEDS" | python3 -c '
          import json, sys
          results = json.load(sys.stdin)
          bad = {job: r["result"] for job, r in results.items() if r["result"] not in ("success", "skipped")}
          print(bad or "all CI jobs succeeded")
          sys.exit(1 if bad or not results else 0)'
